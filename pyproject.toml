[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1meta"
version = "0.1.0"
description = "Sentinel-1 CDSE catalogue CSVs -> OData metadata -> GeoParquet -> OCI registry"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "shapely>=2.0",
    "numpy>=1.26",
    "duckdb>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "geopandas>=1.0", "pyproj>=3.6"]

[project.scripts]
s1meta-worker = "s1meta.worker:main"
s1meta-merge = "s1meta.merge:main"

[tool.setuptools]
packages = ["s1meta"]
