name: Catalogue updates

# Complements the always-on backfill worker deployed via Kamal.
#
# - daily: CDSE regenerates the last 30 days every day at ~03:00 UTC. The
#   worker builds new days (RUN_ONCE, last 31 days), then `sync --recent-days
#   31` updates the regenerated ones per product.
# - monthly: CDSE regenerates every CSV on the 2nd. `sync` reads the whole
#   mission out of the catalogue zip, diffs it against the ID files, updates
#   the changed days and pushes the new ID files.
#
# GitHub-hosted runners have normal internet, so no IPv6/SOCKS-proxy
# workaround as on stardust. Work goes to /mnt (the big disk on the runner).
#
# Pushes to GHCR with the workflow's own GITHUB_TOKEN, no PAT secret. Each
# package (sentinel-1, sentinel-2, ...) must give this repository the Write
# role: package settings -> Manage Actions access.
#
# The schedules stay off until a manual run (workflow_dispatch) has worked.

permissions:
  contents: read
  packages: write

on:
  # schedule:
  #   - cron: "0 6 * * *"  # daily, 06:00 UTC
  #   - cron: "0 12 2 * *" # monthly, the 2nd, 12:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: daily or monthly
        default: daily
        type: choice
        options: [daily, monthly]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1 # one mission at a time: one CDSE client
      matrix:
        mission: [sentinel-1, sentinel-2]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cdsemeta .

      - name: Pick job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 12 2 * *" ]; then echo "job=monthly" >> "$GITHUB_OUTPUT"; else echo "job=daily" >> "$GITHUB_OUTPUT"; fi
          else
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          fi
          sudo mkdir -p /mnt/work && sudo chown 1000 /mnt/work

      - name: Daily (last 31 days)
        if: steps.job.outputs.job == 'daily'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run() { docker run --rm -v /mnt/work:/work -w /work -e MISSION=${{ matrix.mission }} \
                    -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN "$@"; }
          run -e ORDER=desc -e RUN_ONCE=1 -e RECENT_DAYS=31 cdsemeta
          run cdsemeta cdsemeta-update sync --work /work/sync --recent-days 31

      - name: Monthly (full dump)
        if: steps.job.outputs.job == 'monthly'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v /mnt/work:/work -w /work -e MISSION=${{ matrix.mission }} \
            -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN cdsemeta cdsemeta-update sync --work /work/sync

      - name: Merge and upload to R2
        if: env.R2_ACCOUNT_ID != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'dataspace' }}
        run: |
          sudo mkdir -p /mnt/work/merge /mnt/work/cache && sudo chown -R 1000 /mnt/work/merge /mnt/work/cache
          docker run --rm -v /mnt/work:/work -w /work \
            -e MISSION=${{ matrix.mission }} \
            -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN \
            -e R2_ACCOUNT_ID -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET \
            cdsemeta cdsemeta-merge \
              --out-dir /work/merge --cache /work/cache \
              --memory-limit 4GB --upload-r2 --delete-after-upload
