name: Sentinel-1 worker (latest days)

# Complements the always-on worker deployed via Kamal, which works through
# the historical backlog (ORDER=asc). This one runs newest-first (ORDER=desc)
# with RUN_ONCE=1, so a scheduled run just catches up on whatever new daily
# CSVs have appeared since the last run and exits -- no long-running process,
# no need for the IPv6/SOCKS-proxy workaround stardust needs (GitHub-hosted
# runners have normal internet).

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cdsemeta .

      - name: Run worker (newest days first, single pass)
        run: |
          docker run --rm \
            -e MISSION=sentinel-1 \
            -e ORDER=desc \
            -e RUN_ONCE=1 \
            -e GHCR_USER=Konkrad \
            -e GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}" \
            cdsemeta
