name: Catalogue updates

# Complements the always-on backfill worker deployed via Kamal.
#
# - daily: CDSE regenerates the last 30 days every day at ~03:00 UTC. The
#   worker builds new days (RUN_ONCE, last 31 days), then `sync --recent-days
#   31` updates the regenerated ones per product.
# - monthly: CDSE regenerates every CSV on the 2nd. `sync` reads the whole
#   mission out of the catalogue zip, diffs it against the ID files, updates
#   the changed days and pushes the new ID files.
# - merge: only the months of the days sync changed, plus the current and
#   previous month (--changed-days); a fresh runner has no merged files, so
#   without it every month of the mission would be rebuilt and re-uploaded.
#
# GitHub-hosted runners have normal internet, so no IPv6/SOCKS-proxy
# workaround as on the old server. Work goes to /mnt (the big disk on the runner).
#
# Pushes to GHCR with the workflow's own GITHUB_TOKEN, no PAT secret. Each
# package (sentinel-1, sentinel-2, ...) must give this repository the Write
# role: package settings -> Manage Actions access.
#
# R2 secrets live in the job's env: a step's `if` can't see its own `env:`.
# The bucket is in the EU jurisdiction, which only answers on the .eu. endpoint.

permissions:
  contents: read
  packages: write

on:
  schedule:
    - cron: "0 6 * * *"  # daily, 06:00 UTC
    - cron: "0 12 2 * *" # monthly, the 2nd, 12:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: daily, monthly, or index (only rebuild the bucket index)
        default: daily
        type: choice
        options: [daily, monthly, index]

# Daily and monthly push the same ID files: queue, don't overlap.
concurrency:
  group: catalogue-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'schedule' || inputs.job != 'index'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
    strategy:
      fail-fast: false
      max-parallel: 1 # one mission at a time: one CDSE client
      matrix:
        mission: [sentinel-1, sentinel-2, sentinel-3, sentinel-5p]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cdsemeta .

      - name: Pick job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 12 2 * *" ]; then echo "job=monthly" >> "$GITHUB_OUTPUT"; else echo "job=daily" >> "$GITHUB_OUTPUT"; fi
          else
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          fi
          sudo mkdir -p /mnt/work && sudo chown 1000 /mnt/work

      - name: Daily (last 31 days)
        if: steps.job.outputs.job == 'daily'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run() { docker run --rm -v /mnt/work:/work -w /work -e MISSION=${{ matrix.mission }} \
                    -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN "$@"; }
          run -e ORDER=desc -e RUN_ONCE=1 -e RECENT_DAYS=31 cdsemeta
          run cdsemeta cdsemeta-update sync --work /work/sync --recent-days 31 --changed-days /work/sync/changed-days.txt

      - name: Monthly (full dump)
        if: steps.job.outputs.job == 'monthly'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v /mnt/work:/work -w /work -e MISSION=${{ matrix.mission }} \
            -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN cdsemeta cdsemeta-update sync --work /work/sync \
            --changed-days /work/sync/changed-days.txt

      - name: Merge and upload to R2
        # Also after a failed sync: the days it did finish are on GHCR, and their
        # months are only listed in changed-days.txt on this machine.
        if: ${{ !cancelled() && env.R2_ACCOUNT_ID != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'dataspace' }}
        run: |
          sudo mkdir -p /mnt/work/merge /mnt/work/cache && sudo chown -R 1000 /mnt/work/merge /mnt/work/cache
          docker run --rm -v /mnt/work:/work -w /work \
            -e MISSION=${{ matrix.mission }} \
            -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN \
            -e R2_ACCOUNT_ID -e R2_ENDPOINT_URL -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET \
            cdsemeta cdsemeta-merge \
              --out-dir /work/merge --cache /work/cache \
              --memory-limit 4GB --upload-r2 --delete-after-upload \
              --changed-days /work/sync/changed-days.txt

  # The bucket's public index (STAC Browser at the root, collections.json,
  # the file pages under /about/ and per folder, files.txt/.tsv, dataspace.duckdb),
  # from a listing of the whole bucket, so it covers every mission. Also runs
  # when a mission failed, for the ones that did upload.
  index:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # STAC Browser (fork with src/local-api: the STAC API is answered in the
      # browser with DuckDB-WASM over the monthly files) at the bucket root.
      - uses: actions/checkout@v4
        with:
          repository: Konkrad/stac-browser
          ref: main
          path: stac-browser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stac-browser/package-lock.json
      - name: Build STAC Browser
        working-directory: stac-browser
        env:
          SB_catalogUrl: https://dataspace.konrad.online/api/
          SB_catalogTitle: Copernicus Data Space catalogue
          SB_historyMode: hash
          SB_allowExternalAccess: "false"
          SB_localApi: '{"url":"https://dataspace.konrad.online/api/","collectionsUrl":"https://dataspace.konrad.online/collections.json"}'
          SB_footerLinks: '[{"label":"Files and downloads","url":"https://dataspace.konrad.online/about/"},{"label":"Documentation","url":"https://github.com/Konkrad/dataspace#readme"}]'
        run: npm ci && npx vite build
      - name: Write and upload the index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'dataspace' }}
        run: cdsemeta-index --out-dir "$RUNNER_TEMP/index" --browser stac-browser/dist --upload-r2
