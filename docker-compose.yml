# One worker container per mission. They share .env (registry login, OData
# settings); only MISSION differs. Each mission goes to its own package,
# ${OCI_BASE}/<mission>, e.g. ghcr.io/konkrad/dataspace/sentinel-1.

x-worker: &worker
  build: .
  image: cdsemeta-worker
  restart: unless-stopped
  env_file: .env
  volumes:
    - work:/work
  stop_grace_period: 30s

services:
  sentinel-1:
    <<: *worker
    environment:
      MISSION: sentinel-1

  # To add a mission later, copy the block above and change MISSION:
  # sentinel-2:
  #   <<: *worker
  #   environment:
  #     MISSION: sentinel-2

  # One-off: docker compose run --rm sentinel-1-merge
  sentinel-1-merge:
    <<: *worker
    restart: "no"
    profiles: ["merge"]
    environment:
      MISSION: sentinel-1
    working_dir: /work
    command: ["python", "-m", "cdsemeta.merge", "--out-dir", "/work/sentinel-1",
              "--cache", "/work/sentinel-1/cache", "--push"]

volumes:
  work:
